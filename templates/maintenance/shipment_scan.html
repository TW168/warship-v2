{% extends "base.html" %}

{% block title %}Shipment Scan{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <!-- Page header -->
  <div class="row mb-4">
    <div class="col">
      <h1 class="page-header h3 mb-0">
        <i class="bi bi-upc-scan me-2" style="color: #154e9a;"></i>Shipment Scan
      </h1>
      <p class="text-muted mt-1">Upload and manage shipment scan documents</p>
    </div>
  </div>

  <!-- Upload section -->
  <div class="row mb-4">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm">
        <div class="card-header d-flex align-items-center gap-2 py-2">
          <i class="bi bi-upload text-primary"></i>
          <span class="fw-semibold small">Upload Shipment Scan File</span>
        </div>
        <div class="card-body pt-3">
          <div class="mb-3">
            <label for="scanFile" class="form-label form-label-sm fw-semibold mb-1">
              Select Excel or CSV File
            </label>
            <input type="file" id="scanFile" class="form-control form-control-sm"
                   accept=".xlsx,.xls,.csv" aria-label="Shipment scan file">
            <div class="form-text">Supported formats: Excel (.xlsx, .xls) and CSV (.csv)</div>
          </div>
          
          <button class="btn btn-primary btn-sm w-100" id="uploadBtn" onclick="uploadFile()">
            <i class="bi bi-cloud-upload me-1"></i>Upload File
          </button>
          
          <div id="uploadStatus" class="mt-3 d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Recent uploads section -->
  <div class="row">
    <div class="col">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-list-ul text-primary"></i>
            <span class="fw-semibold small">Recent Uploads</span>
          </div>
          <button class="btn btn-outline-primary btn-sm" onclick="loadRecords()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
        <div class="card-body">
          <div id="recordsContainer">
            <div class="d-flex justify-content-center py-4">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div>
              <span class="text-muted">Loading records...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Upload functionality
async function uploadFile() {
  const input = document.getElementById('scanFile');
  const btn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('uploadStatus');
  
  if (!input.files.length) {
    showStatus('Please select a file first.', 'warning');
    return;
  }

  const formData = new FormData();
  formData.append('file', input.files[0]);

  // Update button state
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Uploading...';

  try {
    const response = await fetch('/maintenance/api/shipment-scan/upload', {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (response.ok) {
      if (result.status === 'duplicate') {
        showStatus('File already uploaded previously.', 'info');
      } else {
        showStatus(`Success! Processed ${result.rows_inserted} records from ${input.files[0].name}`, 'success');
        input.value = ''; // Clear file input
        loadRecords(); // Refresh the records list
      }
    } else {
      showStatus(`Error: ${result.error}`, 'danger');
    }
  } catch (error) {
    showStatus(`Upload failed: ${error.message}`, 'danger');
  } finally {
    // Reset button
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-cloud-upload me-1"></i>Upload File';
  }
}

// Show status message
function showStatus(message, type) {
  const statusEl = document.getElementById('uploadStatus');
  statusEl.className = `alert alert-${type} py-2 small`;
  statusEl.textContent = message;
  statusEl.classList.remove('d-none');

  // Auto-hide success/info messages after 5 seconds
  if (type === 'success' || type === 'info') {
    setTimeout(() => {
      statusEl.classList.add('d-none');
    }, 5000);
  }
}

// Load and display recent records
async function loadRecords() {
  const container = document.getElementById('recordsContainer');
  
  try {
    const response = await fetch('/maintenance/api/shipment-scan?limit=20');
    const data = await response.json();

    if (response.ok) {
      renderRecords(data.records, data.total);
    } else {
      container.innerHTML = `
        <div class="alert alert-danger py-2 small">
          Failed to load records: ${data.error}
        </div>
      `;
    }
  } catch (error) {
    container.innerHTML = `
      <div class="alert alert-danger py-2 small">
        Failed to load records: ${error.message}
      </div>
    `;
  }
}

// Render records table
function renderRecords(records, total) {
  const container = document.getElementById('recordsContainer');
  
  // Cache records for viewRecord function
  recordsCache = records;
  
  if (!records || records.length === 0) {
    container.innerHTML = `
      <div class="text-center py-4 text-muted">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        No uploads found. Upload your first shipment scan file above.
      </div>
    `;
    return;
  }

  const tableHtml = `
    <div class="table-responsive">
      <table class="table table-sm table-hover">
        <thead class="table-light sticky-top">
          <tr>
            <th>File Name</th>
            <th>Upload Date</th>
            <th>Shipment Data</th>
            <th>Size</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${records.map(record => `
            <tr>
              <td>
                <i class="bi bi-file-earmark-text text-primary me-1"></i>
                ${escapeHtml(record.source_file)}
              </td>
              <td>
                <small class="text-muted">
                  ${new Date(record.uploaded_at).toLocaleString()}
                </small>
              </td>
              <td>
                <div class="small">
                  ${record.tracking_number ? `<span class="badge bg-info me-1">${escapeHtml(record.tracking_number)}</span>` : ''}
                  ${record.status ? `<span class="badge bg-secondary me-1">${escapeHtml(record.status)}</span>` : ''}
                  ${record.carrier ? `<div class="text-muted">${escapeHtml(record.carrier)}</div>` : ''}
                  ${record.weight ? `<div class="text-muted">${record.weight} lbs</div>` : ''}
                </div>
              </td>
              <td>
                <small class="text-muted">
                  ${formatFileSize(record.file_size)}
                </small>
              </td>
              <td>
                <button class="btn btn-outline-secondary btn-sm" 
                        onclick="viewRecord(${record.id})" title="View Details">
                  <i class="bi bi-eye"></i>
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ${total > 20 ? `<div class="text-muted small mt-2">Showing 20 of ${total} total records</div>` : ''}
  `;
  
  container.innerHTML = tableHtml;
}

// View individual record details
function viewRecord(id) {
  const record = recordsCache.find(r => r.id === id);
  if (!record) {
    alert('Record not found');
    return;
  }
  
  let details = `Shipment Scan Record #${id}\n\n`;
  details += `File: ${record.source_file}\n`;
  details += `Uploaded: ${new Date(record.uploaded_at).toLocaleString()}\n\n`;
  
  details += `=== SHIPMENT DETAILS ===\n`;
  if (record.tracking_number) details += `Tracking: ${record.tracking_number}\n`;
  if (record.shipment_id) details += `Shipment ID: ${record.shipment_id}\n`;
  if (record.order_number) details += `Order: ${record.order_number}\n`;
  if (record.bol_number) details += `BOL: ${record.bol_number}\n`;
  if (record.status) details += `Status: ${record.status}\n`;
  if (record.carrier) details += `Carrier: ${record.carrier}\n`;
  
  if (record.origin || record.destination) {
    details += `\n=== LOCATIONS ===\n`;
    if (record.origin) details += `From: ${record.origin}\n`;
    if (record.destination) details += `To: ${record.destination}\n`;
    if (record.current_location) details += `Current: ${record.current_location}\n`;
  }
  
  if (record.weight || record.package_count || record.pallet_count) {
    details += `\n=== PACKAGE INFO ===\n`;
    if (record.weight) details += `Weight: ${record.weight} lbs\n`;
    if (record.package_count) details += `Packages: ${record.package_count}\n`;
    if (record.pallet_count) details += `Pallets: ${record.pallet_count}\n`;
  }
  
  if (record.shipper || record.consignee) {
    details += `\n=== PARTIES ===\n`;
    if (record.shipper) details += `Shipper: ${record.shipper}\n`;
    if (record.consignee) details += `Consignee: ${record.consignee}\n`;
  }
  
  if (record.notes) {
    details += `\nNotes: ${record.notes}\n`;
  }
  
  alert(details);
}

// Cache records for viewing
let recordsCache = [];

// Utility functions
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatFileSize(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// Load records when page loads
document.addEventListener('DOMContentLoaded', function() {
  loadRecords();
});
</script>
{% endblock %}
