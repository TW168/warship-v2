{% extends "base.html" %}

{% block title %}Sales Summary{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row mb-3">
    <div class="col">
      <h1 class="fw-bold" style="color: #154e9a;">
        <i class="bi bi-file-earmark-bar-graph me-2"></i>Sales Summary
      </h1>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-xl-5 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-light border-bottom">
          <h5 class="mb-0">
            <i class="bi bi-cloud-arrow-up me-2"></i>Upload PDF
          </h5>
        </div>
        <div class="card-body">
          <label for="pdfFile" class="form-label fw-semibold">Select PDF file(s)</label>
          <input type="file" class="form-control mb-3" id="pdfFile" accept=".pdf,application/pdf" multiple>
          <button class="btn btn-primary w-100" id="uploadBtn" onclick="handleUpload()">
            <i class="bi bi-cloud-upload me-2"></i>Upload and Save to MySQL
          </button>
          <div id="uploadResult" class="alert mt-3 d-none" role="alert"></div>
        </div>
      </div>

      <div class="card shadow-sm mt-4">
        <div class="card-header bg-light border-bottom d-flex justify-content-between align-items-center">
          <h5 class="mb-0">
            <i class="bi bi-graph-up-arrow me-2"></i>MTD Shipment Qty Trend
          </h5>
          <span class="badge text-bg-light border" id="stretchTrendCount">0 points</span>
        </div>
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-md-12">
              <label for="trendProductFilter" class="form-label small fw-semibold mb-1">Product</label>
              <select id="trendProductFilter" class="form-select form-select-sm">
                <option value="amtopp">AMTOPP</option>
                <option value="bopp">BOPP</option>
                <option value="concentrate">Concentrate</option>
                <option value="iscc">ISCC</option>
                <option value="sc">SC</option>
                <option value="stretch_film" selected>Stretch film</option>
              </select>
            </div>
          </div>
          <div class="position-relative" style="height: 300px;">
            <canvas id="stretchMtdTrendChart" aria-label="Line chart of STRETCH MTD shipment quantity by business date" role="img"></canvas>
          </div>
          <div id="stretchTrendEmpty" class="text-muted small mt-2 d-none">
            No records found for the selected product filter. Upload a Sales Summary PDF to populate the chart.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let stretchTrendChart = null;

function toNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function formatNumber(value) {
  return toNumber(value).toLocaleString();
}

function formatPercent(value) {
  return `${(toNumber(value) * 100).toFixed(1)}%`;
}

function formatCurrency(value) {
  return toNumber(value).toLocaleString(undefined, {
    style: 'currency',
    currency: 'USD',
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

function setConversionBar(id, ratio) {
  const bar = document.getElementById(id);
  const pct = Math.max(0, Math.min(100, toNumber(ratio) * 100));
  bar.style.width = `${pct}%`;
}

function destroyStretchChart() {
  if (stretchTrendChart) {
    stretchTrendChart.destroy();
    stretchTrendChart = null;
  }
}

function buildYearDatasets(points) {
  const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const byYear = new Map();

  points.forEach((p) => {
    const year = Number(p.year);
    const month = Number(p.month);
    if (!Number.isFinite(year) || !Number.isFinite(month) || month < 1 || month > 12) {
      return;
    }
    if (!byYear.has(year)) {
      byYear.set(year, new Array(12).fill(null));
    }
    byYear.get(year)[month - 1] = toNumber(p.mtd_shipment_qty);
  });

  const palette = ['#154e9a', '#e67e22', '#16a085', '#c0392b', '#8e44ad', '#2c3e50', '#7f8c8d'];
  const years = Array.from(byYear.keys()).sort((a, b) => a - b);
  const datasets = years.map((year, idx) => {
    const color = palette[idx % palette.length];
    return {
      label: String(year),
      data: byYear.get(year),
      borderColor: color,
      backgroundColor: color,
      borderWidth: 2,
      fill: false,
      tension: 0.2,
      pointRadius: 2,
      pointHoverRadius: 4,
      spanGaps: true,
    };
  });

  return { labels, datasets };
}

function renderStretchChart(points) {
  const canvas = document.getElementById('stretchMtdTrendChart');
  const empty = document.getElementById('stretchTrendEmpty');
  const count = document.getElementById('stretchTrendCount');
  const monthEndPoints = points.filter((p) => p && p.year != null && p.month != null);
  const chartData = buildYearDatasets(monthEndPoints);

  count.textContent = `${monthEndPoints.length} month-end point${monthEndPoints.length === 1 ? '' : 's'}`;
  empty.classList.toggle('d-none', monthEndPoints.length > 0);

  destroyStretchChart();

  if (!monthEndPoints.length) {
    return;
  }

  stretchTrendChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: chartData.labels,
      datasets: chartData.datasets,
    },
    options: {
      maintainAspectRatio: false,
      responsive: true,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: {
          display: true,
          position: 'top',
        },
        tooltip: {
          callbacks: {
            label(context) {
              return `${context.dataset.label}: ${formatNumber(context.parsed.y)}`;
            },
            title(context) {
              const first = context && context.length ? context[0] : null;
              return first ? `Month: ${first.label}` : '';
            },
          },
        },
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Month',
          },
        },
        y: {
          beginAtZero: true,
          ticks: {
            callback(value) {
              return formatNumber(value);
            },
          },
          title: {
            display: true,
            text: 'MTD Shipment Qty',
          },
        },
      },
    },
  });
}

async function loadStretchTrend() {
  const productFilter = document.getElementById('trendProductFilter');
  const productKey = productFilter ? productFilter.value : 'stretch_film';

  try {
    const params = new URLSearchParams({ product_key: productKey });
    const res = await fetch(`/maintenance/api/sales-summary/mtd-shipment-trend?${params.toString()}`, { cache: 'no-store' });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.detail || ('HTTP ' + res.status));

    const points = Array.isArray(payload.points) ? payload.points : [];
    renderStretchChart(points);
  } catch (err) {
    destroyStretchChart();
    const empty = document.getElementById('stretchTrendEmpty');
    const count = document.getElementById('stretchTrendCount');
    count.textContent = '0 points';
    empty.textContent = 'Unable to load STRETCH trend: ' + err.message;
    empty.classList.remove('d-none');
  }
}

async function handleUpload() {
  const fileInput = document.getElementById('pdfFile');
  const btn = document.getElementById('uploadBtn');
  const result = document.getElementById('uploadResult');
  const files = Array.from(fileInput.files || []);

  if (!files.length) {
    result.className = 'alert alert-warning mt-3';
    result.textContent = 'Please select at least one PDF file.';
    result.classList.remove('d-none');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Uploading...';
  result.classList.add('d-none');

  const formData = new FormData();
  for (const f of files) formData.append('files', f);

  try {
    const res = await fetch('/maintenance/api/sales-summary/upload', { method: 'POST', body: formData });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.detail || ('HTTP ' + res.status));

    result.className = 'alert alert-success mt-3';
    let msg = payload.message;
    if (payload.files && payload.files.length) {
      msg += '\n\n' + payload.files.map(f => '- ' + f.file + ': ' + f.inserted + ' rows').join('\n');
    }
    result.innerText = msg;
    result.classList.remove('d-none');
    fileInput.value = '';
    await loadStretchTrend();
  } catch (err) {
    result.className = 'alert alert-danger mt-3';
    result.textContent = 'Upload failed: ' + err.message;
    result.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Upload and Save to MySQL';
  }
}

if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach((el) => {
    new bootstrap.Tooltip(el);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const productFilter = document.getElementById('trendProductFilter');
  if (productFilter) {
    productFilter.addEventListener('change', () => {
      loadStretchTrend();
    });
  }

  loadStretchTrend();
});
</script>
{% endblock %}
