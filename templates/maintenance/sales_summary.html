{% extends "base.html" %}

{% block title %}Sales Summary{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row mb-3">
    <div class="col">
      <h1 class="fw-bold" style="color: #154e9a;">
        <i class="bi bi-file-earmark-bar-graph me-2"></i>Sales Summary
      </h1>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-xl-5 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-light border-bottom">
          <h5 class="mb-0">
            <i class="bi bi-cloud-arrow-up me-2"></i>Upload PDF
          </h5>
        </div>
        <div class="card-body">
          <label for="pdfFile" class="form-label fw-semibold">Select PDF file(s)</label>
          <input type="file" class="form-control mb-3" id="pdfFile" accept=".pdf,application/pdf" multiple>
          <button class="btn btn-primary w-100" id="uploadBtn" onclick="handleUpload()">
            <i class="bi bi-cloud-upload me-2"></i>Upload and Save to MySQL
          </button>
          <div id="uploadResult" class="alert mt-3 d-none" role="alert"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function toNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function formatNumber(value) {
  return toNumber(value).toLocaleString();
}

function formatPercent(value) {
  return `${(toNumber(value) * 100).toFixed(1)}%`;
}

function formatCurrency(value) {
  return toNumber(value).toLocaleString(undefined, {
    style: 'currency',
    currency: 'USD',
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

function setConversionBar(id, ratio) {
  const bar = document.getElementById(id);
  const pct = Math.max(0, Math.min(100, toNumber(ratio) * 100));
  bar.style.width = `${pct}%`;
}

async function handleUpload() {
  const fileInput = document.getElementById('pdfFile');
  const btn = document.getElementById('uploadBtn');
  const result = document.getElementById('uploadResult');
  const files = Array.from(fileInput.files || []);

  if (!files.length) {
    result.className = 'alert alert-warning mt-3';
    result.textContent = 'Please select at least one PDF file.';
    result.classList.remove('d-none');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Uploading...';
  result.classList.add('d-none');

  const formData = new FormData();
  for (const f of files) formData.append('files', f);

  try {
    const res = await fetch('/maintenance/api/sales-summary/upload', { method: 'POST', body: formData });
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.detail || ('HTTP ' + res.status));

    result.className = 'alert alert-success mt-3';
    let msg = payload.message;
    if (payload.files && payload.files.length) {
      msg += '\n\n' + payload.files.map(f => '- ' + f.file + ': ' + f.inserted + ' rows').join('\n');
    }
    result.innerText = msg;
    result.classList.remove('d-none');
    fileInput.value = '';
  } catch (err) {
    result.className = 'alert alert-danger mt-3';
    result.textContent = 'Upload failed: ' + err.message;
    result.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Upload and Save to MySQL';
  }
}

if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach((el) => {
    new bootstrap.Tooltip(el);
  });
}
</script>
{% endblock %}
